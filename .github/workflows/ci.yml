name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel superseded runs on the same branch to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check (mypy strict)
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Test (fails under 90% coverage)
        run: pytest --cov=openneuro_pipeline --cov-report=term-missing

  windows:
    name: Windows make (${{ matrix.make-shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # GNU make on Windows uses bash when Git's sh is on PATH, cmd.exe
        # otherwise. Test both, since developers' machines differ.
        make-shell: [default, cmd.exe]
    env:
      MAKE_ARGS: ${{ matrix.make-shell == 'cmd.exe' && 'SHELL=cmd.exe' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install via make
        shell: cmd
        run: make %MAKE_ARGS% install
      - name: Test via make
        shell: cmd
        run: make %MAKE_ARGS% test
      - name: Help and clean via make
        shell: cmd
        run: make %MAKE_ARGS% help && make %MAKE_ARGS% clean
