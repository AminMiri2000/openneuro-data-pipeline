[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openneuro-pipeline"
version = "0.3.0"
description = "Batch pipeline that ingests OpenNeuro dataset metadata into DuckDB and models it with dbt."
readme = "README.md"
# Upper bound: dagster-dbt supports Python up to 3.13 (and dbt's own
# dependencies lag new Python releases). Raise it once they support newer ones.
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Mohammad" }]
dependencies = [
    "requests>=2.31",
    "duckdb>=1.3",  # 1.3 adds the `lambda x:` syntax used by the dbt models
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.10,<2",
    "click>=8.1",
    "python-dotenv>=1.0",
    "dagster>=1.10,<2",
    "dagster-webserver>=1.10,<2",
    "dagster-dbt>=0.26,<1",
    # dbt requires protobuf 6; grpcio-health-checking (via Dagster) moved to
    # protobuf 7 in 1.81. Pinned until dbt supports protobuf 7.
    "protobuf>=6.31,<7",
    "grpcio-health-checking>=1.75,<1.81",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "pre-commit>=3.8",
]

[project.scripts]
openneuro-pipeline = "openneuro_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"openneuro_pipeline.dashboard" = ["template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: errors, I: import order, B: bug-prone patterns, UP: modern syntax,
# SIM: simplifications, N: naming, D: docstrings on public modules, C90: complexity
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C90", "D1"]
ignore = [
    "D102", "D103", "D105", "D107",  # self-explanatory methods/functions may skip docstrings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = ["responses.*"]
ignore_missing_imports = true

# Dagster checks asset return annotations at runtime by identity with the bare
# class (`-> MaterializeResult`), so the generic form mypy wants cannot be used.
[[tool.mypy.overrides]]
module = ["openneuro_pipeline.orchestration.*"]
disable_error_code = ["type-arg"]

[tool.coverage.report]
fail_under = 90
show_missing = true
