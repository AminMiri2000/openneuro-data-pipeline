[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openneuro-pipeline"
version = "0.2.0"
description = "Batch pipeline that ingests OpenNeuro dataset metadata into a local DuckDB warehouse."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohammad" }]
dependencies = [
    "requests>=2.31",
    "duckdb>=1.1",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "pre-commit>=3.8",
]

[project.scripts]
openneuro-pipeline = "openneuro_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: errors, I: import order, B: bug-prone patterns, UP: modern syntax,
# SIM: simplifications, N: naming, D: docstrings on public modules, C90: complexity
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C90", "D1"]
ignore = [
    "D102", "D103", "D105", "D107",  # self-explanatory methods/functions may skip docstrings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = ["responses.*"]
ignore_missing_imports = true

[tool.coverage.report]
fail_under = 90
show_missing = true
